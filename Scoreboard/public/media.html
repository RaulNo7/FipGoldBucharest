<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRP Live — Media</title>
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="media.css" />
  <script>if (window.chrome && window.chrome.webview) { document.documentElement.classList.add('in-app'); }</script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-logo" src="frp-mark.png" alt="" /> <span class="brand-name">FRP Live</span> <span class="brand-sub">Media</span></div>
    <div class="topbar-right">
      <span id="connDot" class="conn-dot" title="connection"></span>
      <span id="connText" class="conn-text">connecting…</span>
    </div>
  </header>

  <main class="layout">
    <div class="card">
      <div class="card-head"><h2>Broadcast</h2><span id="obsBadge" class="badge">OBS: …</span></div>
      <div class="row gap wrap">
        <button class="btn btn-ghost" id="introBtn">👥 Show match</button>
        <button class="btn btn-ghost" id="toggleScoreBtn">Hide score</button>
        <button class="btn btn-ghost" id="playersOnlyBtn" title="The scoreboard shows only the players (names and flags), without the score. Press again to bring the score back. The court TV keeps the score.">Players only</button>
        <button class="btn btn-ghost" id="interviewBtn" title="Interview camera on the ATEM, interview mics on (set on the Admin tab, card Interview button). Press again to go back to the court.">🎤 Interview</button>
      </div>
      <div class="row gap wrap present-row">
        <div class="pcard-group" data-player="0-0">
          <span class="pcard-name"></span>
          <span class="pcard-sides">
            <button class="btn btn-ghost pcard-btn" data-pcard="0-0" data-side="left" title="Card on the left of the frame">◀ Left</button>
            <button class="btn btn-ghost pcard-btn" data-pcard="0-0" data-side="right" title="Card on the right of the frame">Right ▶</button>
          </span>
        </div>
        <div class="pcard-group" data-player="0-1">
          <span class="pcard-name"></span>
          <span class="pcard-sides">
            <button class="btn btn-ghost pcard-btn" data-pcard="0-1" data-side="left" title="Card on the left of the frame">◀ Left</button>
            <button class="btn btn-ghost pcard-btn" data-pcard="0-1" data-side="right" title="Card on the right of the frame">Right ▶</button>
          </span>
        </div>
        <span class="present-vs">vs</span>
        <div class="pcard-group" data-player="1-0">
          <span class="pcard-name"></span>
          <span class="pcard-sides">
            <button class="btn btn-ghost pcard-btn" data-pcard="1-0" data-side="left" title="Card on the left of the frame">◀ Left</button>
            <button class="btn btn-ghost pcard-btn" data-pcard="1-0" data-side="right" title="Card on the right of the frame">Right ▶</button>
          </span>
        </div>
        <div class="pcard-group" data-player="1-1">
          <span class="pcard-name"></span>
          <span class="pcard-sides">
            <button class="btn btn-ghost pcard-btn" data-pcard="1-1" data-side="left" title="Card on the left of the frame">◀ Left</button>
            <button class="btn btn-ghost pcard-btn" data-pcard="1-1" data-side="right" title="Card on the right of the frame">Right ▶</button>
          </span>
        </div>
      </div>
      <div class="row gap wrap bc-row">
        <span class="bc-label">⏱ Match time</span>
        <span class="bc-value" id="clockNow">--:--</span>
        <input type="text" id="clockInput" class="bc-input" placeholder="hh:mm" maxlength="5" inputmode="numeric" />
        <button class="btn btn-ghost" id="clockSetBtn" type="button">Set</button>
        <button class="btn btn-ghost" id="clockResetBtn" type="button" title="Clear the timer (it starts again with the next point or Start)">Reset</button>
        <button class="btn btn-ghost" id="clockHideBtn" type="button" title="Show or hide the timer on the scoreboard (it keeps running)">Hide</button>
      </div>
      <div class="row gap wrap bc-row">
        <span class="bc-label">🎙 Commentary</span>
        <button class="btn btn-ghost" data-commentary="watch" type="button" title="Info bar: eye icon + NO COMMENTATOR">👁 Watch only</button>
        <button class="btn btn-ghost" data-commentary="live" type="button">🎙 Commentators</button>
        <input type="text" id="commentatorNames" class="bc-input bc-names" placeholder="e.g. Miguel &amp; Arsh" maxlength="40" />
      </div>
      <p class="hint" id="interviewStatus" hidden></p>
      <p class="hint" id="breakStatus">…</p>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Replay</h2>
        <label class="check replay-now" title="Off: the buttons only save the clip; play it later from the list below">
          <input type="checkbox" id="replayPlayNow" checked /> Play right away
        </label>
        <span id="replayBadge" class="badge"></span>
      </div>
      <div class="spots spots-controls spots-replay">
        <button class="btn spot spot-replay spot-short" data-replay-last="10" title="Save the buffer and play only its last 10 seconds">
          <span class="spot-label">⏪ 10 s</span>
          <span class="spot-file">last 10 s</span>
        </button>
        <button class="btn spot spot-replay spot-short" data-replay-last="15" title="Save the buffer and play only its last 15 seconds">
          <span class="spot-label">⏪ 15 s</span>
          <span class="spot-file">last 15 s</span>
        </button>
        <button class="btn spot spot-replay spot-short" id="saveReplayBtn" title="Save the buffer and play all of it">
          <span class="spot-label" id="replaySecondsBig">⏪ 20 s</span>
          <span class="spot-file" id="replaySecondsLabel">last 20 s</span>
        </button>
        <button class="btn spot spot-cancel" id="cancelReplayBtn" disabled>
          <span class="spot-num">STOP</span>
          <span class="spot-label">Cancel</span>
          <span class="spot-file">back to the live scene</span>
        </button>
      </div>
      <div class="video-row">
        <select id="replaySelect" aria-label="Saved replay"></select>
        <button class="btn btn-play" id="playReplayBtn">▶ Play</button>
        <button class="btn btn-stop" id="stopReplayBtn" disabled title="Stop the replay and go back to the live scene">■ Cancel</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Commercials</h2><span id="lastPlayed" class="badge"></span></div>
      <div class="spots spots-controls">
        <button class="btn spot spot-break" id="playAdsBtn">
          <span class="spot-num">ALL</span>
          <span class="spot-label">▶ Play all commercials</span>
          <span class="spot-file">01 → 06, one after another</span>
        </button>
        <button class="btn spot spot-cancel" id="cancelAdsBtn" disabled>
          <span class="spot-num">STOP</span>
          <span class="spot-label">Cancel</span>
          <span class="spot-file">back to the live scene</span>
        </button>
      </div>
      <div class="video-row">
        <select id="videoSelect" aria-label="Video file"></select>
        <button class="btn btn-play" id="playVideoBtn">▶ Play</button>
      </div>
    </div>
  </main>

  <script src="countries.js"></script>
  <script src="client.js"></script>
  <script src="media.js"></script>
</body>
</html>

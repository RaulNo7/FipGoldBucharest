<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRP Live — Players intro</title>
  <link rel="stylesheet" href="intro.css" />
</head>
<body>
  <div id="intro" class="intro hidden">
    <div class="intro-header">
      <span id="introTitle" class="intro-title"></span>
      <span id="introSubtitle" class="intro-subtitle"></span>
      <span id="introStart" class="intro-start" hidden></span>
    </div>

    <div class="intro-board">
      <div class="intro-block" data-block="0">
        <div class="intro-row">
          <span class="intro-flag" data-flag="0-0"></span>
          <span class="intro-name" data-pname="0-0"></span>
        </div>
        <div class="intro-row">
          <span class="intro-flag" data-flag="0-1"></span>
          <span class="intro-name" data-pname="0-1"></span>
        </div>
      </div>

      <div class="intro-divider"></div>

      <div class="intro-block" data-block="1">
        <div class="intro-row">
          <span class="intro-flag" data-flag="1-0"></span>
          <span class="intro-name" data-pname="1-0"></span>
        </div>
        <div class="intro-row">
          <span class="intro-flag" data-flag="1-1"></span>
          <span class="intro-name" data-pname="1-1"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- One player's card (Media tab: ◀ left / right ▶ per player), filled from padeltour.ro profile data.
       Vertical, at the left or right edge, so the player can stay visible on the other side of the video. -->
  <div id="pcard" class="pcard hidden">
    <div class="pcard-flag"><i></i><i></i><i></i></div>
    <div class="pcard-head">
      <div class="pc-head-row">
        <span class="pc-brand"><img src="frp-mark.png" alt="" /><b>FRP Live</b></span>
        <span class="pc-source">Statistici<span class="sep">·</span><b>Padel Tour</b></span>
      </div>
      <div class="pc-event"><span id="pcTournament"></span><span class="sep" id="pcDivSep">·</span><span id="pcDivision"></span></div>
    </div>
    <div class="pcard-main">
      <div class="pc-photo">
        <img id="pcPhoto" class="pc-face" alt="" />
        <span id="pcInitials" class="pc-initials"></span>
        <span class="pc-flagdot" id="pcFlagDot"></span>
      </div>
      <div class="pc-name" id="pcName"></div>
      <div class="pc-facts" id="pcFacts"></div>
      <div class="pc-ranks" id="pcRanks"></div>
      <div class="pc-big" id="pcBig">
        <div class="pc-stat gold"><div class="num" id="pcPoints"></div><div class="lbl">Puncte totale</div></div>
        <div class="pc-stat"><div class="num" id="pcLevel"></div><div class="lbl">Nivel PT</div><div class="tier" id="pcTier"></div></div>
        <div class="pc-stat"><div class="num" id="pcWinRate"></div><div class="lbl">Win rate</div></div>
      </div>
    </div>
    <div class="pc-strip" id="pcStrip">
      <div><span class="v" id="pcTournaments"></span><span class="k">Turnee jucate</span></div>
      <div><span class="v" id="pcWL"></span><span class="k" id="pcWLLabel">Victorii – Înfrângeri</span></div>
      <div><span class="v pc-medals" id="pcTitles"></span><span class="k">Titluri</span></div>
      <div><span class="v" id="pcSets"></span><span class="k" id="pcSetsLabel">Seturi câștigate</span></div>
      <div class="pc-form-cell"><span class="k" id="pcFormLabel">Formă · ultimele 10</span><span class="pc-form" id="pcForm"></span></div>
    </div>
  </div>

  <script src="countries.js"></script>
  <script src="client.js"></script>
  <script src="intro.js"></script>
</body>
</html>
